<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Card Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .game-container {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 20px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 10px;
        }

        .info-box {
            background: #f1f1f1;
            padding: 10px 20px;
            border-radius: 10px;
            min-width: 100px;
        }

        .info-box span {
            display: block;
            font-size: 13px;
            color: #777;
        }

        .info-box strong {
            font-size: 22px;
            color: #333;
        }

        .card-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: auto;
        }

        .card {
            height: 100px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            backface-visibility: hidden;
        }

        .card-front {
            background: #667eea;
            color: white;
            font-size: 40px;
        }

        .card-back {
            background: #f8f8f8;
            transform: rotateY(180deg);
            border: 3px solid #667eea;
        }

        .card.matched .card-back {
            background: #d4edda;
            border-color: #28a745;
        }

        .restart-button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .restart-button:hover {
            background: #4f63c7;
        }

        #message {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #28a745;
        }

        @media (max-width: 500px) {
            .game-container {
                padding: 20px;
            }

            .card {
                height: 70px;
            }

            .card-front,
            .card-back {
                font-size: 28px;
            }

            .info-box {
                padding: 8px;
                min-width: 80px;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>🧠 Memory Card Game</h1>

        <p class="subtitle">
            A Data Structure Based Interactive Game
        </p>

        <div class="game-info">

            <div class="info-box">
                <span>Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div class="info-box">
                <span>Matches</span>
                <strong id="matches">0</strong>
            </div>

            <div class="info-box">
                <span>Time</span>
                <strong id="timer">00:00</strong>
            </div>

        </div>

        <div id="cardBoard" class="card-board"></div>

        <button class="restart-button" onclick="restartGame()">
            🔄 Restart Game
        </button>

        <div id="message"></div>

    </div>


    <script>

        // Array containing 8 pairs of cards
        const cardValues = [
            "🍎", "🍎",
            "🍕", "🍕",
            "🚀", "🚀",
            "🐱", "🐱",
            "⚽", "⚽",
            "🎮", "🎮",
            "🌟", "🌟",
            "🍩", "🍩"
        ];


        let cards = [];

        let firstCard = null;
        let secondCard = null;

        let lockBoard = false;

        let moves = 0;
        let matches = 0;

        let seconds = 0;
        let timer = null;

        let gameStarted = false;


        // Shuffle cards using Fisher-Yates algorithm
        function shuffle(array) {

            for (let i = array.length - 1; i > 0; i--) {

                let randomIndex =
                    Math.floor(Math.random() * (i + 1));

                [array[i], array[randomIndex]] =
                    [array[randomIndex], array[i]];
            }

            return array;
        }


        // Create cards
        function createCards() {

            const board =
                document.getElementById("cardBoard");

            board.innerHTML = "";

            cards = shuffle([...cardValues]);


            cards.forEach(function(emoji) {

                const card =
                    document.createElement("div");

                card.classList.add("card");

                card.dataset.value = emoji;


                card.innerHTML = `
                    <div class="card-inner">

                        <div class="card-front">
                            ?
                        </div>

                        <div class="card-back">
                            ${emoji}
                        </div>

                    </div>
                `;


                card.addEventListener(
                    "click",
                    function() {
                        flipCard(card);
                    }
                );


                board.appendChild(card);

            });
        }


        // Flip selected card
        function flipCard(card) {

            if (lockBoard)
                return;

            if (card === firstCard)
                return;

            if (card.classList.contains("matched"))
                return;


            startTimer();


            card.classList.add("flipped");


            if (firstCard === null) {

                firstCard = card;

                return;
            }


            secondCard = card;

            moves++;


            document.getElementById("moves")
                .textContent = moves;


            checkMatch();
        }


        // Check whether cards match
        function checkMatch() {

            const isMatch =
                firstCard.dataset.value ===
                secondCard.dataset.value;


            if (isMatch) {

                firstCard.classList.add("matched");

                secondCard.classList.add("matched");


                matches++;


                document.getElementById("matches")
                    .textContent = matches;


                resetBoard();


                // Player wins after finding 8 pairs
                if (matches === 8) {

                    clearInterval(timer);

                    document.getElementById("message")
                        .textContent =
                        "🎉 Congratulations! You Won!";
                }

            }

            else {

                lockBoard = true;


                setTimeout(function() {

                    firstCard.classList.remove("flipped");

                    secondCard.classList.remove("flipped");

                    resetBoard();

                }, 800);

            }
        }


        // Reset selected cards
        function resetBoard() {

            firstCard = null;

            secondCard = null;

            lockBoard = false;
        }


        // Start timer
        function startTimer() {

            if (gameStarted)
                return;


            gameStarted = true;


            timer = setInterval(function() {

                seconds++;


                let minutes =
                    Math.floor(seconds / 60);

                let remainingSeconds =
                    seconds % 60;


                document.getElementById("timer")
                    .textContent =
                    String(minutes).padStart(2, "0")
                    + ":"
                    + String(remainingSeconds).padStart(2, "0");

            }, 1000);
        }


        // Restart game
        function restartGame() {

            clearInterval(timer);


            moves = 0;
            matches = 0;
            seconds = 0;

            gameStarted = false;

            firstCard = null;
            secondCard = null;

            lockBoard = false;


            document.getElementById("moves")
                .textContent = "0";

            document.getElementById("matches")
                .textContent = "0";

            document.getElementById("timer")
                .textContent = "00:00";

            document.getElementById("message")
                .textContent = "";


            createCards();
        }


        // Start the game
        createCards();

    </script>

</body>
</html>
